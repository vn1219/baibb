<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#e4e4e6" />
<title>Bai & Candies</title>
<link rel="stylesheet" href="style.css?v=2" />
</head>
<body>
<div class="app">

  <!-- 顶栏：两人头像（男左女右）+ 名字 + 一行小字；右边拍一拍、电话 -->
  <header class="top">
    <div class="pair">
      <span class="av av-b">白</span>
      <span class="av av-c">C</span>
    </div>
    <div class="who">
      <b>Bai &amp; Candies</b>
      <small><span id="day">Day 1</span> · 邳州 18° · <span id="now">--:--</span></small>
    </div>
    <button class="rb" data-t="拍了拍他">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12M11 11V4.5a1.5 1.5 0 0 1 3 0V11M14 11V6.5a1.5 1.5 0 0 1 3 0V14a6 6 0 0 1-6 6h-.5a6 6 0 0 1-4.6-2.2L4 15.5a1.5 1.5 0 0 1 2.3-1.9L8 15"/></svg>
    </button>
    <button class="rb" data-t="正在拨给白夙晟…">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>
    </button>
  </header>

  <!-- 主角：一起听。大壳套小格 -->
  <section class="shell listen">
    <div class="shell-head">
      <span class="eyebrow">Listen Together</span>
      <span class="chip">FAV</span>
    </div>
    <div class="inner">
      <div class="art" id="art">
        <i class="orb o1"></i><i class="orb o2"></i>
        <p class="lyric" id="lyric">我在你身后，一直都在</p>
      </div>
      <div class="meta">
        <div class="t">
          <b id="song">Back Seat</b>
          <small id="artist">JYJ</small>
        </div>
        <button class="heart" id="like" aria-label="喜欢">
          <svg viewBox="0 0 24 24"><path d="M12 20.5s-7.2-4.4-9.3-8.8C1.3 8.6 3.1 5 6.6 5c2.1 0 3.6 1.2 4.4 2.6h2c.8-1.4 2.3-2.6 4.4-2.6 3.5 0 5.3 3.6 3.9 6.7-2.1 4.4-9.3 8.8-9.3 8.8z"/></svg>
        </button>
      </div>
      <div class="prog" id="prog"><i id="bar"></i></div>
      <div class="times"><span id="cur">1:08</span><span id="dur">3:48</span></div>
    </div>
    <div class="ctrls">
      <button class="rb s" id="prev" aria-label="上一首"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button class="play" id="play" aria-label="播放"><svg viewBox="0 0 24 24" fill="currentColor" id="playIco"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="rb s" id="next" aria-label="下一首"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    </div>
  </section>

  <!-- 第二：他的话。黑色聊天卡 -->
  <section class="say">
    <div class="say-head">
      <span class="av av-b sm">白</span>
      <b>白夙晟</b>
      <time id="saidAt">14:52</time>
    </div>
    <p class="said" id="said">小猫，下午的课上完了没。上完了就过来，我在。</p>
    <form class="field" id="sayForm">
      <input id="sayIn" placeholder="跟他说一句…" autocomplete="off" />
      <button class="send" type="submit" aria-label="发送"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6l-.1 6.5L15 12 3.3 13.9z"/></svg></button>
    </form>
  </section>

  <!-- 配角：四个入口，一排小圆钮 -->
  <nav class="entries">
    <button data-t="信箱">
      <i class="rb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3.5 7 8.5 6 8.5-6"/></svg><em class="badge">2</em></i>
      <span>信箱</span>
    </button>
    <button data-t="日记">
      <i class="rb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M9 9h5M9 13h5"/></svg></i>
      <span>日记</span>
    </button>
    <button data-t="记忆">
      <i class="rb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0-6 6c0 2.2 1.2 3.5 2 4.5V17h8v-3.5c.8-1 2-2.3 2-4.5a6 6 0 0 0-6-6zM9.5 21h5"/></svg></i>
      <span>记忆 <small>204</small></span>
    </button>
    <button data-t="朋友圈">
      <i class="rb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4.5"/><ellipse cx="12" cy="12" rx="10" ry="3.6" transform="rotate(-20 12 12)"/></svg></i>
      <span>朋友圈</span>
    </button>
  </nav>

  <!-- 心跳：一条小胶囊 -->
  <button class="hb" id="hb">
    <span class="hb-dot"><svg viewBox="0 0 24 24"><path d="M12 20.5s-7.2-4.4-9.3-8.8C1.3 8.6 3.1 5 6.6 5c2.1 0 3.6 1.2 4.4 2.6h2c.8-1.4 2.3-2.6 4.4-2.6 3.5 0 5.3 3.6 3.9 6.7-2.1 4.4-9.3 8.8-9.3 8.8z"/></svg></span>
    <b>Heartbeat</b>
    <small id="hbText">下次叫醒 --:--</small>
  </button>

</div>

<!-- Dock -->
<nav class="dock" id="dock">
  <button class="on" data-t="">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2 3.5 10v9.3c0 .7.5 1.2 1.2 1.2H9.5v-5.8h5v5.8h4.8c.7 0 1.2-.5 1.2-1.2V10z"/></svg><span>Home</span>
  </button>
  <button data-t="私聊">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5c-5 0-9 3.4-9 7.7 0 2.4 1.3 4.6 3.4 6l-.8 3.3 3.9-2c.8.2 1.6.3 2.5.3 5 0 9-3.4 9-7.6s-4-7.7-9-7.7z"/></svg><span>Chat</span>
  </button>
  <button data-t="一起听">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 3.5v11.2a3 3 0 1 1-2-2.8V8.3l-8 1.6v7.8a3 3 0 1 1-2-2.8V5.6z"/></svg><span>Listen</span>
  </button>
  <button data-t="我的">
    <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4.2"/><path d="M4 20.2c0-4 3.6-6.4 8-6.4s8 2.4 8 6.4c0 .4-.3.8-.8.8H4.8c-.5 0-.8-.4-.8-.8z"/></svg><span>Me</span>
  </button>
</nav>

<div class="toast" id="toast"></div>
<script src="app.js?v=2"></script>
</body>
</html>
