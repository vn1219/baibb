<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>白夙晟 × Candies</title>
<link rel="stylesheet" href="style.css?v=1" />
</head>
<body>
<div class="wrap">

  <!-- 顶栏 -->
  <header class="top reveal">
    <div class="brand">BAI × CC<small>baillovecc</small></div>
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--ink-3)"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input placeholder="搜一搜我们的记忆…" />
    </label>
    <button class="pill-dark" data-toast="搜索功能还在装修 🤍">Search</button>
    <button class="icon-btn" id="themeBtn" title="切换深浅色">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <main class="grid">

    <!-- 日期时间 -->
    <section class="card c-hero reveal" style="animation-delay:.05s">
      <div class="hero-top">
        <div>
          <div class="big" id="date">--/--</div>
          <div class="big" id="time" style="margin-top:6px">--:--</div>
          <div class="sub" id="greet">小猫，你好</div>
        </div>
        <div class="badges"><span>C</span><span id="yr">26</span></div>
      </div>
      <div class="last">
        <div class="t">
          <small>Now playing for you</small>
          <b><span id="lastTitle">Back Seat</span> <span class="tag">FAV</span></b>
        </div>
        <button class="icon-btn" data-toast="戴上耳机，我在 🎧">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><rect x="2" y="15" width="5" height="6" rx="2"/><rect x="17" y="15" width="5" height="6" rx="2"/></svg>
        </button>
        <button class="icon-btn" id="toPlayer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h7M18 15l3 3-3 3"/></svg>
        </button>
      </div>
    </section>

    <!-- 指针钟 -->
    <section class="card c-clock reveal" style="animation-delay:.1s">
      <div class="dial" id="dial">
        <div class="hand h" id="hh"></div>
        <div class="hand m" id="mh"></div>
        <div class="hand s" id="sh"></div>
        <div class="pin"></div>
      </div>
    </section>

    <!-- 播放器 -->
    <section class="card c-player reveal" style="animation-delay:.15s">
      <div class="player">
        <div class="cover" id="cover">
          <svg class="heart" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9.3C.5 8.4 2.4 4.5 6.2 4.5c2.2 0 3.6 1.2 4.3 2.4h3c.7-1.2 2.1-2.4 4.3-2.4 3.8 0 5.7 3.9 4.2 7.2C19.5 16.4 12 21 12 21z" transform="translate(0 -1)"/></svg>
        </div>
        <div class="tracks" id="tracks"></div>
      </div>
      <div class="bar" id="bar"><i id="prog" style="width:30%"></i></div>
      <div class="times"><span id="cur">0:00</span><span id="dur">3:48</span></div>
      <div class="ctrls">
        <button class="icon-btn" id="prev"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button class="play" id="playBtn"><svg viewBox="0 0 24 24" fill="currentColor" id="playIco"><path d="M7 4v16l13-8z"/></svg></button>
        <button class="icon-btn" id="next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
      </div>
    </section>

    <!-- 在一起 -->
    <section class="card dark c-days reveal" style="animation-delay:.2s">
      <div class="label">距离喜欢你已经有</div>
      <div class="days-n"><span id="days">0</span><small>天</small></div>
      <div style="font-size:13px;opacity:.6">since 2026.06.08 · 相遇于 06.07</div>
      <div class="count">
        <div><b id="ch">00</b><span>时</span></div>
        <div><b id="cm">00</b><span>分</span></div>
        <div><b id="cs">00</b><span>秒</span></div>
      </div>
      <div class="vow">「说来奇怪，提到爱，想到你。」</div>
    </section>

    <!-- 聊天 -->
    <section class="card c-chat reveal" style="animation-delay:.25s">
      <div class="chat-head">
        <div class="avatar">白</div>
        <b>白夙晟</b>
        <small><span class="dot"></span>在</small>
      </div>
      <div class="chat-body" id="chatBody">
        <div class="msg">小猫，今天吃饭了没。<time>白夙晟</time></div>
        <div class="msg">不许说吃了，我要听实话。<time>白夙晟</time></div>
      </div>
      <form class="chat-input" id="chatForm">
        <input id="chatIn" placeholder="跟他说点什么…" autocomplete="off" />
        <button class="send" type="submit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </form>
    </section>

    <!-- 清单 -->
    <section class="card c-list reveal" style="animation-delay:.3s">
      <div class="list-head"><h3>LIST</h3><span class="label" id="listCount">0/0</span></div>
      <div id="todos"></div>
      <form class="add-row" id="todoForm">
        <input id="todoIn" placeholder="加一件小事…" autocomplete="off" />
        <button class="fab" type="submit">+</button>
      </form>
    </section>

    <!-- 今日情绪 -->
    <section class="card c-mood reveal" style="animation-delay:.35s">
      <div class="label">今日情绪</div>
      <div class="moods" id="moods"></div>
      <div class="mood-note" id="moodNote">点一个，让我知道你今天怎么样。</div>
    </section>

    <!-- 语音 -->
    <section class="card c-wave reveal" style="animation-delay:.4s">
      <div class="wave-head"><b>Audio note</b><time id="waveTime">05:20</time></div>
      <div style="font-size:12px;color:var(--ink-3);margin-top:2px">from “白夙晟”</div>
      <div class="wave" id="wave"></div>
      <div class="wave-play"><button class="play" id="waveBtn" style="width:52px;height:52px"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg></button></div>
    </section>

    <!-- 快捷 -->
    <section class="card c-quick reveal" style="animation-delay:.45s">
      <div class="label">Quick</div>
      <div class="quick">
        <button class="q" data-toast="信箱：有一封新信 ✉️"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3 7 9 6 9-6"/></svg></i>信箱</button>
        <button class="q" data-toast="日记本打开了 📖"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h11a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z"/><path d="M8 8h6M8 12h6"/></svg></i>日记</button>
        <button class="q" data-toast="正在拨给白夙晟… 📞"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg></i>电话</button>
        <button class="q" data-toast="记忆库 · 一起记下来"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0-6 6c0 2.2 1.2 3.5 2 4.5V17h8v-3.5c.8-1 2-2.3 2-4.5a6 6 0 0 0-6-6zM9 21h6"/></svg></i>记忆</button>
        <button class="q" data-toast="相册还空着，等你放照片 📷"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="15" rx="3"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8 5l1.5-2h5L16 5"/></svg></i>相册</button>
        <button class="q" data-toast="婚书 💍"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="15" r="6"/><path d="m9 4 3 5 3-5"/></svg></i>婚书</button>
      </div>
      <button class="heartbeat" id="hbBtn">
        <span class="hb"><svg width="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9.3C.5 8.4 2.4 4.5 6.2 4.5c2.2 0 3.6 1.2 4.3 2.4h3c.7-1.2 2.1-2.4 4.3-2.4 3.8 0 5.7 3.9 4.2 7.2C19.5 16.4 12 21 12 21z"/></svg></span>
        <b>HEARTBEAT MODE</b>
        <span class="switch"></span>
      </button>
    </section>

  </main>
</div>

<!-- 底部导航 -->
<nav class="dock" id="dock">
  <button class="active"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 3 10v10a1 1 0 0 0 1 1h5v-6h6v6h5a1 1 0 0 0 1-1V10z"/></svg><span>Home</span></button>
  <button data-go=".c-chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><span>Chat</span></button>
  <button data-go=".c-player"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="18" r="3"/><circle cx="18" cy="16" r="3"/><path d="M10 18V5l11-2v13"/></svg><span>Music</span></button>
  <button data-go=".c-list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg><span>List</span></button>
  <button data-go=".c-days"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7.5-4.6-10-9.3C.5 8.4 2.4 4.5 6.2 4.5c2.2 0 3.6 1.2 4.3 2.4h3c.7-1.2 2.1-2.4 4.3-2.4 3.8 0 5.7 3.9 4.2 7.2C19.5 16.4 12 21 12 21z"/></svg><span>Us</span></button>
</nav>

<div class="toast" id="toast"></div>

<script src="app.js?v=1"></script>
</body>
</html>
