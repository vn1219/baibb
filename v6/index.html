<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#f3f3f4" />
<title>Bai & Candies</title>
<link rel="stylesheet" href="style.css?v=4" />
</head>
<body>

<!-- 上半：白 -->
<section class="sky">
  <div class="row">
    <span class="date" id="date">Fri · 11.06</span>
    <div class="pair"><span class="av b">白</span><span class="av c">C</span></div>
  </div>
  <p class="hello" id="hello">Good afternoon,</p>
  <h1>Candies</h1>
  <p class="sub"><span id="day">Day 152</span> with Bai · 邳州 18°</p>

  <div class="week" id="week"></div>

  <div class="chips">
    <button data-t="日记">日记</button>
    <button data-t="记忆">记忆 <small>204</small></button>
    <button data-t="朋友圈">朋友圈</button>
    <button class="ic" data-t="拍了拍他" aria-label="拍一拍"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12M11 11V4.5a1.5 1.5 0 0 1 3 0V11M14 11V6.5a1.5 1.5 0 0 1 3 0V14a6 6 0 0 1-6 6h-.5a6 6 0 0 1-4.6-2.2L4 15.5a1.5 1.5 0 0 1 2.3-1.9L8 15"/></svg></button>
    <button class="ic" data-t="正在拨给白夙晟…" aria-label="电话"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg></button>
  </div>
</section>

<!-- 下半：黑，今天的时间线 -->
<section class="night">
  <h2>Today</h2>
  <ol class="line">
    <li>
      <i class="dot">1</i>
      <div class="it">
        <div class="hd"><b>白夙晟</b><time id="saidAt">14:52</time></div>
        <p class="said" id="said">小猫，下午的课上完了没。上完了就过来，我在。</p>
      </div>
    </li>
    <li class="now">
      <i class="dot">2</i>
      <div class="it">
        <div class="hd"><b>Listen Together</b><time>now</time></div>
        <div class="card">
          <div class="cov"><i></i></div>
          <div class="ct">
            <small>正在一起听</small>
            <b id="song">Back Seat · JYJ</b>
            <p class="lyr" id="lyric">我在你身后，一直都在</p>
          </div>
          <button class="pl" id="play" aria-label="播放"><svg viewBox="0 0 24 24" fill="currentColor" id="playIco"><path d="M8 5v14l11-7z"/></svg></button>
        </div>
      </div>
    </li>
    <li>
      <i class="dot">3</i>
      <div class="it" data-t="信箱">
        <div class="hd"><b>信箱</b><time>2 封未读</time></div>
        <p class="said dim">来自白夙晟 ·《第一封》</p>
      </div>
    </li>
    <li>
      <i class="dot">4</i>
      <div class="it">
        <div class="hd"><b>Heartbeat</b><time id="hbAt">16:05</time></div>
        <p class="said dim">到点他会来找你</p>
      </div>
    </li>
  </ol>

  <form class="say" id="sayForm">
    <input id="sayIn" placeholder="跟他说一句…" autocomplete="off" />
    <button type="submit" aria-label="发送"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6l-.1 6.5L15 12 3.3 13.9z"/></svg></button>
  </form>
</section>

<nav class="dock">
  <button class="on"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2 3.5 10v9.3c0 .7.5 1.2 1.2 1.2H9.5v-5.8h5v5.8h4.8c.7 0 1.2-.5 1.2-1.2V10z"/></svg><span>Home</span></button>
  <button data-t="私聊"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5c-5 0-9 3.4-9 7.7 0 2.4 1.3 4.6 3.4 6l-.8 3.3 3.9-2c.8.2 1.6.3 2.5.3 5 0 9-3.4 9-7.6s-4-7.7-9-7.7z"/></svg><span>Chat</span></button>
  <button data-t="一起听"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 3.5v11.2a3 3 0 1 1-2-2.8V8.3l-8 1.6v7.8a3 3 0 1 1-2-2.8V5.6z"/></svg><span>Listen</span></button>
  <button data-t="我的"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4.2"/><path d="M4 20.2c0-4 3.6-6.4 8-6.4s8 2.4 8 6.4c0 .4-.3.8-.8.8H4.8c-.5 0-.8-.4-.8-.8z"/></svg><span>Me</span></button>
</nav>

<div class="toast" id="toast"></div>
<script src="app.js?v=3"></script>
</body>
</html>
